spring:
  application:
    name: tickify
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/tickify
    username: ${DB_USER}
    password: ${DB_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
server:
  port: 8099
